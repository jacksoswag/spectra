name: Spectra
options:
  bundleIdPrefix: com.spectra
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    MTL_FAST_MATH: YES
    MTL_LANGUAGE_REVISION: Metal31
    GCC_WARN_UNINITIALIZED_AUTOS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO

targets:
  Spectra:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spectra.Spectra
        PRODUCT_NAME: Spectra
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Spectra.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: MetalFX.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: CoreImage.framework
      - sdk: CoreVideo.framework
      - sdk: IOSurface.framework
      - sdk: IOKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: AVFoundation.framework
