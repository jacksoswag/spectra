<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1140"/><stop offset="0.55" stop-color="#0d0a1a"/><stop offset="1" stop-color="#06121f"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3df0"/><stop offset="0.4" stop-color="#8b5cff"/>
      <stop offset="0.7" stop-color="#2fd9ff"/><stop offset="1" stop-color="#b6ff3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.5"/><stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS icon canvas (superellipse-ish rounded square) -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <!-- prism -->
  <path d="M512 232 L760 700 L264 700 Z" fill="url(#spec)" opacity="0.16"/>
  <path d="M512 232 L760 700 L264 700 Z" stroke="url(#spec)" stroke-width="22" stroke-linejoin="round"/>
  <!-- incoming white beam -->
  <path d="M150 470 L420 470" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <!-- dispersed spectrum -->
  <path d="M610 470 L900 380" stroke="#ff3df0" stroke-width="22" stroke-linecap="round"/>
  <path d="M620 500 L910 470" stroke="#8b5cff" stroke-width="22" stroke-linecap="round"/>
  <path d="M620 530 L910 560" stroke="#2fd9ff" stroke-width="22" stroke-linecap="round"/>
  <path d="M610 560 L900 650" stroke="#b6ff3d" stroke-width="22" stroke-linecap="round"/>
  <rect x="11" y="11" width="1002" height="1002" rx="222" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
</svg>
